[project]
name = "heartbeat"
version = "0.1.0"
description = "跨平台个人状态 Dashboard"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlmodel>=0.0.22",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "apscheduler>=3.11.0,<4.0",
    "httpx>=0.27.0",
    "mss>=10.2.0",
    "Pillow>=12.0.0",
    "psutil>=7.2.0",
]

[project.optional-dependencies]
client = [
    "PySide6>=6.6.0",
    "winrt-runtime>=3.2.1; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=3.2.1; sys_platform == 'win32'",
    "winrt-Windows.Media.Control>=2.0.0; sys_platform == 'win32'",
    "jeepney>=0.8.0; sys_platform == 'linux'",
]
windows = [
    "winrt-Windows.Media.Control>=2.0.0",
]
linux = [
    "jeepney>=0.8.0",
]
dev = [
    "ruff>=0.6.0",
]

[project.scripts]
heartbeat-server = "heartbeat.server.main:run"
heartbeat-client = "heartbeat.client.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["heartbeat*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"heartbeat/server/routers/*.py" = ["B008"]
